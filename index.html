<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main>
      <section class="logo-section">
        <div class="image">
          <div class="text-and-logo">
            <img src="./assets/images/odin-lined.png" alt="The Odin logo" />
            <h1>ODIN</h1>
          </div>
        </div>
        <small
          >Photo by
          <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
          <a href="https://unsplash.com/photos/25xggax4bSA">Unsplash</a></small
        >
      </section>
      <section class="form-section">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. <br />Sigh
          up <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
        <p>Let's do this!</p>
        <form action="">
          <div class="row">
            <div class="item">
              <label for="first_name">First name *</label>
              <input
                type="text"
                id="first_name"
                name="first_name"
                required
                class="border border-slate-300 rounded-md px-2 py-1 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
              />
              <span></span>
            </div>
            <div class="item">
              <label for="last_name">Last name *</label>
              <input
                type="text"
                id="last_name"
                name="last_name"
                required
                class="border border-slate-300 rounded-md px-2 py-1 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
              />
              <span></span>
            </div>
          </div>
          <div class="row">
            <div class="item">
              <label for="email">Email *</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                class="border border-slate-300 rounded-md px-2 py-1 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
              />
              <span></span>
            </div>
            <div class="item">
              <label for="phone_number"
                >Phone number (Format: 12-123-1234)</label
              >
              <input
                type="tel"
                id="phone_number"
                name="phone_number"
                pattern="\d{2}-\d{3}-\d{4}"
                class="border border-slate-300 rounded-md px-2 py-1 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
              />
              <span></span>
            </div>
          </div>
          <div class="row last-row">
            <div class="item">
              <label for="password">Password *</label>
              <input
                type="password"
                id="password"
                name="password"
                pattern="^.{8,}$"
                required
                class="border border-slate-300 rounded-md px-2 py-1 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
              />
              <span></span>
            </div>
            <div class="item">
              <label for="confirm_password">Confirm password *</label>
              <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                pattern="^.{8,}$"
                required
                class="border border-slate-300 rounded-md px-2 py-1 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
              />
              <span></span>
            </div>
          </div>
          <div class="row btn-row">
            <div class="item">
              <button type="submit" class="active:scale-95">
                Create account
              </button>
              <p>
                <small>Already have account? <a href="">Log in</a></small>
              </p>
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
